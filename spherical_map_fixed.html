<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The World We Make — Spherical Lens</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0e17;color:#e0e6ed;font:13px Segoe UI,Tahoma,sans-serif}#canvas{position:fixed;inset:0}.panel{position:absolute;z-index:5;background:rgba(15,20,30,.95);border:1px solid #2a3a4a;border-radius:8px;padding:12px;backdrop-filter:blur(8px)}#side{left:10px;top:10px;width:320px;max-height:calc(100vh - 20px);overflow:auto}h2{font-size:16px;color:#4fc3f7;margin:0 0 8px}label{display:block;color:#8899aa;font-size:11px;margin:9px 0 4px}select,button{width:100%;padding:7px;background:#1a2535;color:#e0e6ed;border:1px solid #2a3a4a;border-radius:4px}button{background:#1565c0;border:0;margin-top:6px;cursor:pointer}.reset{background:#c62828!important}.stats,.status{margin-top:9px;padding:8px;background:#17202c;border-radius:4px;font-size:11px}.v{color:#4fc3f7;font-weight:bold}.ok{border-left:3px solid #43a047}.warn{border-left:3px solid #ffb74d}.error{border-left:3px solid #ef5350}#events{right:10px;top:55px;width:290px;max-height:320px;overflow:auto}.event{padding:4px 0;border-bottom:1px solid #1a2535;font-size:11px}.event b{color:#ffb74d}#legend{right:10px;bottom:70px}.legend{font-size:11px;margin-top:6px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.info{position:absolute;z-index:5;top:10px;left:50%;transform:translateX(-50%);padding:6px 14px;background:rgba(15,20,30,.85);border:1px solid #2a3a4a;border-radius:8px;color:#8899aa;font-size:11px}.info b{color:#4fc3f7}#timeline{left:50%;bottom:15px;transform:translateX(-50%);display:flex;gap:10px;align-items:center}#year{width:300px}#yearText{color:#4fc3f7;font-weight:bold;min-width:42px}.tip{position:fixed;z-index:20;display:none;pointer-events:none;background:rgba(15,20,30,.98);border:1px solid #4fc3f7;border-radius:6px;padding:9px;font-size:11px;max-width:280px}.tip h4{color:#4fc3f7;margin:0 0 5px}@media(max-width:800px){#events,#legend,.info{display:none}#side{width:270px}#timeline{width:90%}#year{width:60%}}
</style></head><body>
<div id="canvas"></div><div class="info">Observer at centre — <b>drag</b> to look · <b>scroll</b> to zoom · equator is fixed reference ring</div>
<div id="side" class="panel"><h2>🌍 The World We Make — Spherical Lens</h2><label>Domain</label><select id="domain"><option value="all">All Domains</option></select><label>Variable</label><select id="variable"><option value="all">All Variables</option></select><label>Place</label><select id="place"><option value="all">All Places</option></select><label>View Mode</label><select id="mode"><option>Observations</option><option>Coverage / Origins</option><option>Temporal Spread</option><option>Coverage + Change</option></select><button id="animate">▶ Animate Time</button><button id="reset" class="reset">⟲ Reset View</button><div class="stats">Variables: <span id="vc" class="v">—</span><br>Places: <span id="pc" class="v">—</span><br>Observations: <span id="oc" class="v">—</span><br>Time range: <span id="tr" class="v">—</span></div><div id="status" class="status ok">Loading project data…</div></div>
<div id="events" class="panel"><b>📅 Evolution Events</b><div id="eventList"></div></div><div id="legend" class="panel"><b>Legend</b><div id="legendList"></div></div><div id="timeline" class="panel"><span>Year</span><input id="year" type="range" min="1900" max="2026" value="2024"><span id="yearText">2024</span></div><div id="tip" class="tip"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>
const SOURCE='https://raw.githubusercontent.com/LumenAgentLighthouse/the-world-we-make/main/spherical_map.html',R=5;
const COLORS={technology:'#ec407a',environment:'#9ccc65',employment:'#4fc3f7',housing:'#66bb6a',crime:'#ef5350',education:'#ffa726',population:'#8d6e63',health:'#ef5350',agriculture:'#78909c',politics:'#ff7043',unknown:'#b0bec5'};
const EVENTS=[{y:2020,t:'Global COVID-19 pandemic'},{y:2008,t:'Global financial crisis'},{y:2020,t:'School closures (COVID-19)'},{y:2024,t:'Administrative boundary reorganisation'}];
let places=[],obs=[],pm=new Map(),scene,camera,renderer,group,eq,markers=[],ray=new THREE.Raycaster(),yaw=0,pitch=0,fov=70,drag=false,lx=0,ly=0,auto=false,adir=1;
const n=v=>{const x=Number(String(v??'').replace(/,/g,''));return Number.isFinite(x)?x:null};
const p3=(lat,lng,r=R)=>{const a=lat*Math.PI/180,b=lng*Math.PI/180;return new THREE.Vector3(r*Math.cos(a)*Math.sin(b),r*Math.sin(a),r*Math.cos(a)*Math.cos(b))};
const setStatus=(t,c='ok')=>{status.textContent=t;status.className='status '+c};
function extract(s,name){const m=s.match(new RegExp('const\\s+'+name+'\\s*=\\s*(\\[[\\s\\S]*?\\]);'));if(!m)throw Error(name+' not found');return Function('return '+m[1])()}
async function data(){try{const r=await fetch(SOURCE,{cache:'no-store'});if(!r.ok)throw Error(r.status);const s=await r.text();places=extract(s,'PLACES');obs=extract(s,'OBSERVATIONS');places.forEach(p=>pm.set(String(p.place_id).toUpperCase(),p));setStatus('Project map dataset loaded','ok')}catch(e){console.warn(e);setStatus('Dataset could not be loaded; geometry remains available','warn')}}
function cameraUpdate(){const d=.001;camera.position.set(d*Math.cos(pitch)*Math.sin(yaw),d*Math.sin(pitch),d*Math.cos(pitch)*Math.cos(yaw));camera.lookAt(new THREE.Vector3(Math.cos(pitch)*Math.sin(yaw),Math.sin(pitch),Math.cos(pitch)*Math.cos(yaw)));camera.fov=fov;camera.updateProjectionMatrix()}
function grid(){let a=[];for(let l=0;l<=360;l+=2)a.push(p3(0,l,R+.02));eq.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(a),new THREE.LineBasicMaterial({color:0x4fc3f7,transparent:true,opacity:.4})));for(const lat of[-60,-30,30,60]){a=[];for(let l=0;l<=360;l+=3)a.push(p3(lat,l,R+.015));eq.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(a),new THREE.LineBasicMaterial({color:0x2a3a4a,transparent:true,opacity:.2})))}for(let l=0;l<360;l+=30){a=[];for(let lat=-90;lat<=90;lat+=4)a.push(p3(lat,l,R+.015));eq.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(a),new THREE.LineBasicMaterial({color:0x2a3a4a,transparent:true,opacity:.2})))}}
function current(){const y=n(year.value),d=domain.value,v=variable.value,p=place.value;return obs.filter(x=>(y==null||n(x.year)<=y)&&(d==='all'||x.domain===d)&&(v==='all'||x.variable_id===v)&&(p==='all'||String(x.place_id).toUpperCase()===p))}
function redraw(){markers.forEach(x=>group.remove(x));markers=[];const latest=new Map;current().forEach(x=>{const k=String(x.place_id).toUpperCase(),o=latest.get(k);if(!o||n(x.year)>n(o.year))latest.set(k,x)});latest.forEach(x=>{const p=pm.get(String(x.place_id).toUpperCase());if(!p)return;const g=new THREE.Group();g.position.copy(p3(n(p.lat),n(p.lng),R+.035));const c=new THREE.Color(COLORS[x.domain]||COLORS.unknown),z=Math.max(.025,Math.min(.11,.025+Math.log10(Math.abs(n(x.value)||0)+1)*.025));g.add(new THREE.Mesh(new THREE.SphereGeometry(z,10,10),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.9})));g.add(new THREE.Mesh(new THREE.SphereGeometry(.012,6,6),new THREE.MeshBasicMaterial({color:0xffffff})));g.userData={name:p.country,variable:x.variable_id,value:x.value,unit:x.unit,year:x.year,domain:x.domain,evidence:x.evidence_type,source:x.source_id};group.add(g);markers.push(g)});stats()}
function stats(){const f=current(),ys=[...new Set(f.map(x=>n(x.year)))].sort((a,b)=>a-b);vc.textContent=new Set(f.map(x=>x.variable_id)).size;pc.textContent=new Set(f.map(x=>x.place_id)).size;oc.textContent=f.length.toLocaleString();tr.textContent=ys.length?ys[0]+'-'+ys[ys.length-1]:'—';yearText.textContent=year.value;eventList.innerHTML=EVENTS.filter(e=>e.y<=n(year.value)).sort((a,b)=>b.y-a.y).map(e=>`<div class="event"><b>${e.y}</b> ${e.t}</div>`).join('')}
function ui(){const ds=[...new Set(obs.map(x=>x.domain))].sort(),vs=[...new Set(obs.map(x=>x.variable_id))].sort(),ps=[...pm.values()].sort((a,b)=>a.country.localeCompare(b.country));domain.innerHTML='<option value="all">All Domains</option>'+ds.map(x=>`<option value="${x}">${x}</option>`).join('');variable.innerHTML='<option value="all">All Variables</option>'+vs.map(x=>`<option>${x}</option>`).join('');place.innerHTML='<option value="all">All Places</option>'+ps.map(x=>`<option value="${x.place_id}">${x.country}</option>`).join('');const ys=obs.map(x=>n(x.year)).filter(Number.isFinite);if(ys.length){year.min=Math.min(...ys);year.max=Math.max(...ys);year.value=year.max}legendList.innerHTML=ds.map(x=>`<div class="legend"><i class="dot" style="background:${COLORS[x]||COLORS.unknown}"></i>${x}</div>`).join('');redraw()}
function tip(e){const r=renderer.domElement.getBoundingClientRect(),m=new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(m,camera);const h=ray.intersectObjects(markers,true)[0];if(!h){tipEl.style.display='none';return}const d=h.object.parent.userData;if(!d.name){tipEl.style.display='none';return}tipEl.style.display='block';tipEl.style.left=e.clientX+15+'px';tipEl.style.top=e.clientY+15+'px';tipEl.innerHTML=`<h4>${d.name}</h4><div>${d.variable}: ${d.value??'—'} ${d.unit||''}</div><div>Year: ${d.year}</div><div>Domain: ${d.domain}</div><div>Evidence: ${d.evidence||'—'}</div><div>Source: ${d.source||'—'}</div>`}
const tipEl=document.getElementById('tip');
function controls(){const c=renderer.domElement;c.addEventListener('mousedown',e=>{drag=true;lx=e.clientX;ly=e.clientY});addEventListener('mouseup',()=>drag=false);c.addEventListener('mousemove',e=>{if(drag){yaw+=(e.clientX-lx)*.005;pitch-=(e.clientY-ly)*.005;pitch=Math.max(-Math.PI/2+.01,Math.min(Math.PI/2-.01,pitch));lx=e.clientX;ly=e.clientY}tip(e)});c.addEventListener('mouseleave',()=>tipEl.style.display='none');c.addEventListener('wheel',e=>{e.preventDefault();fov=Math.max(25,Math.min(100,fov+e.deltaY*.04));cameraUpdate()},{passive:false});c.addEventListener('touchstart',e=>{if(e.touches.length===1){drag=true;lx=e.touches[0].clientX;ly=e.touches[0].clientY}},{passive:true});c.addEventListener('touchmove',e=>{if(drag&&e.touches.length===1){yaw+=(e.touches[0].clientX-lx)*.005;pitch-=(e.touches[0].clientY-ly)*.005;lx=e.touches[0].clientX;ly=e.touches[0].clientY}},{passive:true});c.addEventListener('touchend',()=>drag=false);[domain,variable,place,mode].forEach(x=>x.addEventListener('change',redraw));year.addEventListener('input',redraw);animate.addEventListener('click',()=>{auto=!auto;animate.textContent=auto?'⏸ Pause':'▶ Animate Time';if(auto)loop()});reset.addEventListener('click',()=>{yaw=pitch=0;fov=70;domain.value=variable.value=place.value='all';year.value=year.max;cameraUpdate();redraw()})}
function loop(){if(!auto)return;let y=n(year.value)+adir,max=n(year.max),min=n(year.min);if(y>=max){y=max;adir=-1}if(y<=min){y=min;adir=1}year.value=y;redraw();setTimeout(loop,400)}
addEventListener('resize',()=>{if(camera&&renderer){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}});
async function boot(){const c=document.getElementById('canvas');renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x0a0e17,1);c.appendChild(renderer.domElement);scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(fov,innerWidth/innerHeight,.01,1000);group=new THREE.Group;eq=new THREE.Group;scene.add(group,eq);group.add(new THREE.Mesh(new THREE.SphereGeometry(R,64,64),new THREE.MeshBasicMaterial({color:0x0d1520,side:THREE.BackSide,transparent:true,opacity:.18})));window.camera=camera;window.renderer=renderer;grid();cameraUpdate();await data();ui();controls();renderer.setAnimationLoop(()=>{cameraUpdate();renderer.render(scene,camera)})}
boot().catch(e=>{console.error(e);setStatus('Map failed to initialise: '+e.message,'error')});
</script></body></html>
