name: Validate data files

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'schema/**'
      - 'variables/**'
      - 'known-gaps/**'
      - '.github/workflows/validate-data.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'schema/**'
      - 'variables/**'
      - 'known-gaps/**'
      - '.github/workflows/validate-data.yml'

permissions:
  contents: read

jobs:
  csv-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check CSV structure, required identifiers and numeric fields
        shell: python
        run: |
          import csv, pathlib, sys
          failures = []
          required_by_file = {
              'gap_register.csv': {'gap_id', 'priority', 'gap_class', 'domain', 'falsification_question'},
              'audit_matrix.csv': {'domain', 'data_coverage', 'next_attack', 'priority'},
              'variable_registry.csv': {'variable_id', 'domain', 'variable_name', 'status'},
          }
          for path in list(pathlib.Path('data').glob('*.csv')) + list(pathlib.Path('variables').glob('*.csv')) + list(pathlib.Path('known-gaps').glob('*.csv')):
              with path.open(newline='', encoding='utf-8-sig') as f:
                  reader = csv.DictReader(f)
                  headers = set(reader.fieldnames or [])
                  rows = list(reader)
              expected = required_by_file.get(path.name)
              if expected and not expected.issubset(headers):
                  failures.append(f'{path}: missing required headers: {sorted(expected - headers)}')
              if not rows:
                  continue
              for i, row in enumerate(rows, start=2):
                  if any((v is None or str(v).strip() == '') for v in row.values() if v is not None):
                      # Empty cells are allowed; only malformed row width is fatal.
                      pass
              if 'observation_id' in headers:
                  ids = [r.get('observation_id') for r in rows]
                  dupes = sorted({x for x in ids if x and ids.count(x) > 1})
                  if dupes:
                      failures.append(f'{path}: duplicate observation_id values: {dupes}')
              if 'value_numeric' in headers:
                  for i, row in enumerate(rows, start=2):
                      value = row.get('value_numeric', '')
                      if value not in ('', None):
                          try:
                              float(value)
                          except ValueError:
                              failures.append(f'{path}:{i}: value_numeric is not numeric: {value!r}')
          if failures:
              print('\n'.join(failures))
              sys.exit(1)
          print('CSV structural checks passed.')
