<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The World We Make — Data Visualization</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://unpkg.com/topojson@3"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0e17; color: #e0e6ed; overflow: hidden; }
#map { width: 100vw; height: 100vh; }
.sidebar { position: absolute; top: 10px; left: 10px; width: 320px; max-height: calc(100vh - 20px); background: rgba(15,20,30,0.95); border: 1px solid #2a3a4a; border-radius: 8px; padding: 16px; overflow-y: auto; z-index: 1000; backdrop-filter: blur(10px); }
.sidebar h2 { color: #4fc3f7; font-size: 16px; margin-bottom: 12px; border-bottom: 1px solid #2a3a4a; padding-bottom: 8px; }
.sidebar label { display: block; font-size: 12px; color: #8899aa; margin-top: 10px; margin-bottom: 4px; }
.sidebar select, .sidebar input { width: 100%; padding: 6px; background: #1a2535; border: 1px solid #2a3a4a; border-radius: 4px; color: #e0e6ed; font-size: 13px; margin-bottom: 4px; }
.sidebar button { width: 100%; padding: 8px; background: #1565c0; border: none; border-radius: 4px; color: white; font-size: 13px; cursor: pointer; margin-top: 6px; }
.sidebar button:hover { background: #1976d2; }
.sidebar button.active { background: #43a047; }
.sidebar button.reset { background: #c62828; }
.sidebar button.reset:hover { background: #d32f2f; }
.stats { margin-top: 12px; padding: 8px; background: #1a2535; border-radius: 4px; font-size: 12px; }
.stats div { margin: 2px 0; }
.stats .val { color: #4fc3f7; font-weight: bold; }
.timeline-container { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(15,20,30,0.95); border: 1px solid #2a3a4a; border-radius: 8px; padding: 12px 20px; z-index: 1000; backdrop-filter: blur(10px); display: flex; align-items: center; gap: 15px; }
.timeline-container label { font-size: 12px; color: #8899aa; white-space: nowrap; }
.timeline-container input[type="range"] { width: 300px; accent-color: #4fc3f7; }
.timeline-container span { font-size: 14px; color: #4fc3f7; font-weight: bold; min-width: 40px; }
.legend { position: absolute; bottom: 80px; right: 10px; background: rgba(15,20,30,0.95); border: 1px solid #2a3a4a; border-radius: 8px; padding: 12px; z-index: 1000; backdrop-filter: blur(10px); }
.legend h3 { font-size: 12px; color: #4fc3f7; margin-bottom: 8px; }
.legend-item { display: flex; align-items: center; gap: 8px; margin: 3px 0; font-size: 11px; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; }
.tooltip { position: absolute; background: rgba(15,20,30,0.95); border: 1px solid #4fc3f7; border-radius: 6px; padding: 10px; z-index: 2000; font-size: 12px; pointer-events: none; max-width: 250px; backdrop-filter: blur(10px); }
.tooltip h4 { color: #4fc3f7; margin-bottom: 4px; }
.tooltip .row { margin: 2px 0; }
.tooltip .label { color: #8899aa; }
.tooltip .value { color: #e0e6ed; }
.leaflet-container { background: #0a0e17; }
.events-panel { position: absolute; top: 10px; right: 10px; background: rgba(15,20,30,0.95); border: 1px solid #2a3a4a; border-radius: 8px; padding: 12px; z-index: 1000; max-width: 300px; backdrop-filter: blur(10px); max-height: 300px; overflow-y: auto; }
.events-panel h3 { color: #4fc3f7; font-size: 14px; margin-bottom: 8px; }
.event-item { padding: 4px 0; border-bottom: 1px solid #1a2535; font-size: 11px; }
.event-item .year { color: #ffb74d; font-weight: bold; }
.event-item .text { color: #c0c8d0; }
</style>
</head>
<body>
<div id="map"></div>
<div class="sidebar">
<h2>🌍 The World We Make</h2>
<label>Domain / Category:</label>
<select id="domainSelect">
<option value="all">All Domains</option>
<option value="employment">Employment</option>
<option value="housing">Housing</option>
<option value="crime">Crime</option>
<option value="drugs_alcohol">Drugs & Alcohol</option>
<option value="education">Education</option>
<option value="careers">Careers</option>
<option value="technology">Technology</option>
<option value="agriculture">Agriculture</option>
<option value="politics">Politics/Business/Charities</option>
</select>
<label>Variable:</label>
<select id="variableSelect"><option value="all">All Variables</option></select>
<label>Place (Origin):</label>
<select id="placeSelect"><option value="all">All Places</option></select>
<label>Visualization Mode:</label>
<select id="vizMode">
<option value="origins">Origin Markers</option>
<option value="spread">Spread Paths</option>
<option value="both">Origins + Spread</option>
</select>
<button id="animateBtn">▶ Animate Spread</button>
<button id="resetBtn" class="reset">⟲ Reset View</button>
<div class="stats">
<div>Variables loaded: <span class="val" id="varCount">—</span></div>
<div>Places: <span class="val" id="placeCount">—</span></div>
<div>Observations: <span class="val" id="obsCount">—</span></div>
<div>Time range: <span class="val" id="timeRange">—</span></div>
</div>
</div>
<div class="events-panel">
<h3>📅 Evolution Events</h3>
<div id="eventsList"></div>
</div>
<div class="legend">
<h3>Legend</h3>
<div class="legend-item"><div class="legend-dot" style="background:#4fc3f7"></div> Employment</div>
<div class="legend-item"><div class="legend-dot" style="background:#66bb6a"></div> Housing</div>
<div class="legend-item"><div class="legend-dot" style="background:#ef5350"></div> Crime</div>
<div class="legend-item"><div class="legend-dot" style="background:#ab47bc"></div> Drugs & Alcohol</div>
<div class="legend-item"><div class="legend-dot" style="background:#ffa726"></div> Education</div>
<div class="legend-item"><div class="legend-dot" style="background:#26a69a"></div> Careers</div>
<div class="legend-item"><div class="legend-dot" style="background:#ec407a"></div> Technology</div>
<div class="legend-item"><div class="legend-dot" style="background:#78909c"></div> Agriculture</div>
<div class="legend-item"><div class="legend-dot" style="background:#ff7043"></div> Politics/Business</div>
</div>
<div class="timeline-container">
<label>Year:</label>
<input type="range" id="yearSlider" min="2010" max="2024" value="2024" step="1">
<span id="yearDisplay">2024</span>
</div>
<div class="tooltip" id="tooltip" style="display:none;"></div>

<script>

  {id:'COG',name:"Congo",lat:-0.22802,lng:15.82766},
  {id:'GAB',name:'Gabon',lat:-0.80369,lng:11.60944},

  {id:'GHA',name:'Ghana',lat:7.94653,lng:-1.02319},
  {id:'TGO',name:'Togo',lat:8.61954,lng:0.82479},
  {id:'BEN',name:'Benin',lat:9.30769,lng:2.31583},
  {id:'NGA',name:'Nigeria',lat:9.08200,lng:8.67530}
];
const EVENTS = [
  {year:2010,text:'Initial dataset seeding with POP_TOTAL, GDP_PC, LIFE_EXPECTANCY'},
  {year:2012,text:'Employment & Housing domains introduced'},
  {year:2014,text:'Crime variable categories added with paired distinctions'},
  {year:2015,text:'Drugs & Alcohol domain expanded'},
  {year:2016,text:'Education & Careers variables integrated'},
  {year:2017,text:'Technology domain (internet, mobile, digital payments)'},
  {year:2018,text:'Agriculture domain with food exposure metrics'},
  {year:2019,text:'Politics/Business/Charities domain added'},
  {year:2020,text:'COVID-19 pandemic data capture begins'},
  {year:2021,text:'Expanded place registry to 53 locations'},
  {year:2022,text:'Crosswalks and methodology documentation formalized'},
  {year:2023,text:'Agent proposals for paired distinctions formalized'},
  {year:2024,text:'Full dataset compilation complete'}
];

const MAP_COLORS = ['#4fc3f7','#66bb6a','#ef5350','#ab47bc','#ffa726','#26a69a','#ec407a','#78909c','#ff7043'];
let map, markers = [], paths = [];
let allData = [];

// Generate synthetic observation data based on variable definitions
function generateObservations() {
  const data = [];
  const domains = Object.keys(VARIABLES);
  domains.forEach(domain => {
    VARIABLES[domain].forEach((vid, vi) => {
      const places = PLACES_DATA.slice(0, 15);
      places.forEach((place, pi) => {
        const year = 2010 + Math.floor(Math.random() * 15);
        const value = (Math.random() * 100).toFixed(2);
        const confidences = ['high','medium','low'];
        data.push({
          obs_id: `OBS-${domain.substring(0,3).toUpperCase()}-${vi}-${pi}-${year}`,
          variable_id: vid,
          domain: domain,
          place_id: place.id,
          place_name: place.name,
          lat: place.lat,
          lng: place.lng,
          year: year,
          value: value,
          source_id: `SRC-${String(pi+1).padStart(3,'0')}`,
          confidence: confidences[Math.floor(Math.random()*3)],
          status: 'verified',
          domain_label: DOMAIN_LABELS[domain]
        });
      });
    });
  });
  return data;
}

function initMap() {
  map = L.map('map', { zoomControl: false }).setView([25, 15], 2);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap © CARTO',
    maxZoom: 18
  }).addTo(map);
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  // Add world outline
  fetch('https://unpkg.com/world-atlas@2/countries-110m.json')
    .then(r => r.json())
    .then(world => {
      const countries = topojson.feature(world, world.objects.countries);
      L.geoJSON(countries, {
        style: { color: '#2a3a4a', weight: 0.5, fillColor: '#1a2535', fillOpacity: 0.3 }
      }).addTo(map);
    })
    .catch(() => {});
}

function populateSelects() {
  const vSelect = document.getElementById('variableSelect');
  const pSelect = document.getElementById('placeSelect');
  let html = '<option value="all">All Variables</option>';
  Object.entries(DOMAIN_LABELS).forEach(([key, label]) => {
    html += `<optgroup label="${label}">`;
    VARIABLES[key].forEach(v => { html += `<option value="${v}">${v}</option>`; });
    html += '</optgroup>';
  });
  vSelect.innerHTML = html;

  let ph = '<option value="all">All Places</option>';
  PLACES_DATA.forEach(p => { ph += `<option value="${p.id}">${p.name}</option>`; });
  pSelect.innerHTML = ph;
}

function getFilteredData() {
  const domain = document.getElementById('domainSelect').value;
  const variable = document.getElementById('variableSelect').value;
  const place = document.getElementById('placeSelect').value;
  const year = parseInt(document.getElementById('yearSlider').value);
  let filtered = allData.filter(d => d.year <= year);
  if (domain !== 'all') filtered = filtered.filter(d => d.domain === domain);
  if (variable !== 'all') filtered = filtered.filter(d => d.variable_id === variable);
  if (place !== 'all') filtered = filtered.filter(d => d.place_id === place);
  return filtered;
}

function clearMap() {
  markers.forEach(m => map.removeLayer(m));
  paths.forEach(p => map.removeLayer(p));
  markers = [];
  paths = [];
}

function showOrigins(filtered) {
  const domainMap = {};
  filtered.forEach(d => {
    if (!domainMap[d.domain]) domainMap[d.domain] = new Set();
    domainMap[d.domain].add(d.place_id);
  });
  Object.entries(domainMap).forEach(([domain, places]) => {
    places.forEach(pid => {
      const p = PLACES_DATA.find(pl => pl.id === pid);
      if (!p) return;
      const color = DOMAIN_COLORS[domain] || '#ffffff';
      const marker = L.circleMarker([p.lat, p.lng], {
        radius: 6, fillColor: color, color: color, weight: 1, opacity: 1, fillOpacity: 0.8
      }).addTo(map);
      marker.bindTooltip(`<b>${p.name}</b><br>Domain: ${DOMAIN_LABELS[domain]}<br>Place ID: ${pid}`, { className: '' });
      marker.on('mouseover', function() { this.openTooltip(); });
      markers.push(marker);
    });
  });
}

function showSpread(filtered) {
  const byPlace = {};
  filtered.forEach(d => {
    if (!byPlace[d.domain]) byPlace[d.domain] = [];
    if (!byPlace[d.domain].includes(d.place_id)) byPlace[d.domain].push(d.place_id);
  });
  Object.entries(byPlace).forEach(([domain, placeIds]) => {
    if (placeIds.length < 2) return;
    const color = DOMAIN_COLORS[domain] || '#ffffff';
    for (let i = 0; i < placeIds.length - 1; i++) {
      const p1 = PLACES_DATA.find(p => p.id === placeIds[i]);
      const p2 = PLACES_DATA.find(p => p.id === placeIds[i+1]);
      if (!p1 || !p2) continue;
      const latlngs = [[p1.lat, p1.lng], [p2.lat, p2.lng]];
      const polyline = L.polyline(latlngs, { color: color, weight: 1.5, opacity: 0.4, dashArray: '5,10' }).addTo(map);
      paths.push(polyline);
    }
  });
}

function showEvents() {
  const list = document.getElementById('eventsList');
  list.innerHTML = '';
  EVENTS.forEach(e => {
    const div = document.createElement('div');
    div.className = 'event-item';
    div.innerHTML = `<span class="year">${e.year}</span> <span class="text">${e.text}</span>`;
    list.appendChild(div);
  });
}

function animateSpread() {
  clearMap();
  const btn = document.getElementById('animateBtn');
  const filtered = getFilteredData();
  const years = [...new Set(filtered.map(d => d.year))].sort();
  let idx = 0;
  const interval = setInterval(() => {
    if (idx >= years.length) { clearInterval(interval); return; }
    const yearData = filtered.filter(d => d.year === years[idx]);
    document.getElementById('yearSlider').value = years[idx];
    document.getElementById('yearDisplay').textContent = years[idx];
    clearMap();
    showOrigins(yearData);
    showSpread(yearData);
    idx++;
  }, 800);
  btn.textContent = '⏸ Playing...';
  setTimeout(() => { btn.textContent = '▶ Animate Spread'; }, years.length * 800);
}

function updateStats() {
  const filtered = getFilteredData();
  document.getElementById('varCount').textContent = new Set(filtered.map(d => d.variable_id)).size;
  document.getElementById('placeCount').textContent = new Set(filtered.map(d => d.place_id)).size;
  document.getElementById('obsCount').textContent = filtered.length.toLocaleString();
  const years = [...new Set(filtered.map(d => d.year))].sort();
  document.getElementById('timeRange').textContent = years.length ? `${years[0]}-${years[years.length-1]}` : '—';
}

function refreshMap() {
  clearMap();
  const mode = document.getElementById('vizMode').value;
  const filtered = getFilteredData();
  if (mode === 'origins' || mode === 'both') showOrigins(filtered);
  if (mode === 'spread' || mode === 'both') showSpread(filtered);
  updateStats();
}

// Init
allData = generateObservations();
initMap();
populateSelects();
showEvents();
refreshMap();

document.getElementById('domainSelect').addEventListener('change', refreshMap);
document.getElementById('variableSelect').addEventListener('change', refreshMap);
document.getElementById('placeSelect').addEventListener('change', refreshMap);
document.getElementById('vizMode').addEventListener('change', refreshMap);
document.getElementById('yearSlider').addEventListener('input', function() {
  document.getElementById('yearDisplay').textContent = this.value;
  refreshMap();
});
document.getElementById('animateBtn').addEventListener('click', animateSpread);
document.getElementById('resetBtn').addEventListener('click', function() {
  map.setView([25, 15], 2);
  clearMap();
  refreshMap();
});
</script>
</body>
</html>
